<!-- Include this section inside your home page where listings should appear -->
<section class="home-listings" id="home-listings">
  <h2>Featured Listings</h2>
  <div class="home-listings__grid" id="home-listings-grid"></div>
</section>

<script src="/listing-images-data.js"></script>
<script>
  const grid = document.getElementById('home-listings-grid');

  if (grid && Array.isArray(window.homeListingImages)) {
    grid.innerHTML = window.homeListingImages
      .map((item) => `
        <article class="listing-card">
          <img src="${item.src}" alt="${item.alt}" loading="lazy" />
        </article>
      `)
      .join('');
  }
</script>

<style>
  .home-listings {
    padding: 2rem 1rem;
  }

  .home-listings__grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
  }

  .listing-card {
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    background: #fff;
  }

  .listing-card img {
    width: 100%;
    height: 210px;
    object-fit: cover;
    display: block;
  }
</style>
