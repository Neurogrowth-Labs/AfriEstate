<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfriEstate - Real Estate Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'Inter', 'sans-serif'],
              heading: ['Instrument Sans', 'Manrope', 'sans-serif'],
            },
            fontSize: {
              'xs': ['0.75rem', { lineHeight: '1rem' }],
              'sm': ['0.8125rem', { lineHeight: '1.25rem' }],
              'base': ['0.9375rem', { lineHeight: '1.5rem' }],
              'lg': ['1.0625rem', { lineHeight: '1.75rem' }],
              'xl': ['1.125rem', { lineHeight: '1.75rem' }],
              '2xl': ['1.375rem', { lineHeight: '2rem' }],
              '3xl': ['1.75rem', { lineHeight: '2.25rem' }],
              '4xl': ['2.25rem', { lineHeight: '2.5rem' }],
              '5xl': ['3rem', { lineHeight: '3rem' }],
            },
            spacing: {
              '1': '4px',
              '2': '8px',
              '3': '12px',
              '4': '16px',
              '5': '24px',
              '6': '32px',
            },
            container: {
              center: true,
              padding: '1.5rem',
              screens: {
                sm: '640px',
                md: '768px',
                lg: '1024px',
                xl: '1200px',
              },
            },
            boxShadow: {
              'sm': '0 1px 2px 0 rgb(0 0 0 / 0.05)',
              'DEFAULT': '0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1)',
              'md': '0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)',
              'lg': '0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)',
            },
            colors: {
              'brand-primary': '#123C2A',
              'brand-secondary': '#C79A45',
              'brand-accent': '#B9683B',
              'brand-gold': '#C79A45',
              'brand-light': '#F7F7F4',
              'brand-dark': '#17201B',
              'brand-success': '#247A50',
              'brand-error': '#C84B4B',
              'brand-surface': '#FFFFFF',
              'brand-surface-muted': '#F0F1ED',
              'brand-border': '#E4E6E1',
              'brand-muted': '#66706A',
              'dark-bg': '#08120E',
              'dark-surface': '#0E1B15',
              'dark-elevated': '#14251D',
              'dark-border': '#24362D',
              'dark-muted': '#9AA69F',
            },
          },
        },
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        /* Hide scrollbars globally but keep elements scrollable */
        * {
          -ms-overflow-style: none !important;  /* IE and Edge */
          scrollbar-width: none !important;  /* Firefox */
        }
        *::-webkit-scrollbar {
          width: 0px !important;
          height: 0px !important;
          background: transparent !important;
          display: none !important;
        }
        html {
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
          @apply font-sans min-h-screen overflow-x-hidden bg-brand-light text-brand-dark dark:bg-dark-bg dark:text-[#F5F5EF] transition-colors duration-300;
        }
        h1, h2, h3, h4, h5, h6 {
          @apply font-heading;
        }
        button {
          @apply font-sans font-semibold;
        }

        .mono-text {
          @apply font-mono;
        }
        input, select, textarea {
            @apply text-sm rounded-md border-slate-300 bg-white focus:ring-brand-primary focus:border-brand-primary dark:bg-slate-800 dark:border-slate-600 dark:text-white;
        }
      }
      
      @layer components {
        @keyframes heartbeat {
          0% { transform: scale(1); }
          14% { transform: scale(1.3); }
          28% { transform: scale(1); }
          42% { transform: scale(1.3); }
          70% { transform: scale(1); }
        }
        .animate-heartbeat {
          animation: heartbeat 0.8s ease-in-out;
        }
        .glass-panel {
          @apply bg-white/82 dark:bg-dark-surface/82 backdrop-blur-xl border border-brand-border/80 dark:border-dark-border rounded-2xl shadow-sm;
        }
        .glass-header {
          @apply bg-brand-light/86 dark:bg-dark-bg/86 backdrop-blur-xl border-b border-brand-border dark:border-dark-border shadow-none;
        }
        .glass-card {
          @apply bg-white dark:bg-dark-surface hover:bg-brand-surface-muted/50 dark:hover:bg-dark-elevated border border-brand-border dark:border-dark-border transition-all duration-300 rounded-2xl shadow-none hover:-translate-y-1;
        }
        .glass-button {
          @apply bg-white/70 dark:bg-dark-surface hover:bg-brand-surface-muted dark:hover:bg-dark-elevated border border-brand-border dark:border-dark-border transition-all rounded-xl text-brand-dark dark:text-[#F5F5EF] shadow-none;
        }
        .glass-badge {
          @apply bg-[#F2E7CF]/90 dark:bg-[#3A2E19]/80 border border-brand-gold/35 text-brand-dark dark:text-[#F5F5EF] rounded-full flex items-center justify-center;
        }
      }
    </style>
    <script type="importmap">
{

    "@google-ai/generativelanguage": "https://aistudiocdn.com/@google-ai/generativelanguage@^3.4.0",
    "react-markdown": "https://esm.sh/react-markdown@9",
    "rehype-raw": "https://esm.sh/rehype-raw@7",
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
  }
}
</script>

</head>

</html>
